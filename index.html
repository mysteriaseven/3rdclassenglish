<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Adventure – 3. Sınıf</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<style>
:root{--g:#58cc02;--gd:#46a302;--b:#1cb0f6;--bd:#1899d6;--r:#ff4b4b;--y:#ffc800;--t:#3c3c3c;--l:#e5e5e5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#f0f9ff;min-height:100%}
body{margin:0;min-height:100vh;min-height:100dvh;font-family:Nunito,system-ui,sans-serif;color:var(--t)}
body::before{content:"";position:fixed;top:0;bottom:0;left:50%;width:min(520px,100%);transform:translateX(-50%);background:#fff;border-left:1px solid rgba(255,75,75,.6);border-right:1px solid rgba(255,75,75,.6);z-index:-1;pointer-events:none}
body{max-width:520px;min-height:100vh;min-height:100dvh;margin:auto;background:transparent;position:relative;overflow-x:hidden}
[hidden]{display:none!important}
#top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:#fff;border-bottom:2px solid var(--l);font-weight:900;font-size:18px}
#map{padding:10px 0 80px;text-align:center;min-height:100vh;min-height:100dvh}
.warn{margin:10px 14px;padding:10px;border-radius:12px;background:#fff3cd;font-weight:800;font-size:14px;text-align:left}
.ub{margin:16px 14px;padding:14px 18px;border-radius:18px;color:#fff;text-align:left;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.ub b{display:block;font-size:13px;opacity:.85}.ub span{font-size:20px;font-weight:900}
.nw{margin:18px 0;display:flex;flex-direction:column;align-items:center}
.nw small{margin-top:6px;font-weight:800;color:#777;font-size:13px}
.node{width:78px;height:70px;border-radius:50%;border:0;font-size:32px;cursor:pointer;font-family:inherit;color:#fff;background:var(--g);box-shadow:0 8px 0 var(--gd);position:relative;transition:transform .1s}
.node:active{transform:translateY(6px);box-shadow:0 2px 0 var(--gd)}
.node.done{background:var(--y);box-shadow:0 8px 0 #d9a600;font-weight:900}
.node.rev{background:var(--r);box-shadow:0 8px 0 #c93a3a;animation:pulse 1.4s infinite}
.node.lock{background:#ccc;box-shadow:0 8px 0 #aaa;filter:grayscale(1);cursor:not-allowed}
.node.cur{animation:pulse 1.4s infinite}
.node.cur::after{content:"BAŞLA";position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:#fff;color:var(--g);border:2px solid var(--l);border-radius:12px;padding:2px 10px;font-size:13px;font-weight:900;animation:bob 1s infinite alternate}
/* Haritadaki dikdörtgen Sürpriz Kart alanı (her 5 dersten sonra) */
.sbox-wrap{margin:22px auto;padding:0 20px;display:flex;justify-content:center}
.sbox{width:100%;max-width:310px;padding:12px 16px;border-radius:16px;border:3px solid #d9d9d9;font-family:inherit;font-weight:900;font-size:15px;display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer;transition:transform .12s;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.sbox:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.sbox .si{font-size:30px;flex-shrink:0;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.22)}
.sbox .st{flex:1;line-height:1.25}
.sbox .st b{display:block;font-size:15px}
.sbox .st small{font-size:12px;opacity:.9;font-weight:800}
.sbox.lock{background:#f3f4f6;color:#888;border-color:#d1d5db;box-shadow:0 5px 0 #c4c9d0;cursor:not-allowed}
.sbox.lock .si{background:#e5e7eb;filter:grayscale(1)}
.sbox.ready{background:linear-gradient(135deg,#fbbf24,#f97316);color:#fff;border-color:#fde047;box-shadow:0 6px 0 #c2410c;animation:pulse 1.4s infinite}
.sbox.own{background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;border-color:#c4b5fd;box-shadow:0 5px 0 #4338ca}
@keyframes pulse{50%{transform:scale(1.06)}}@keyframes bob{to{top:-36px}}
#quiz,#done,#admin,#prize{position:fixed;inset:0;max-width:520px;margin:auto;background:#fff;display:flex;flex-direction:column;z-index:10;animation:slide .3s}
@keyframes slide{from{transform:translateY(40px);opacity:0}}
.bar{display:flex;align-items:center;gap:12px;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.bar button{border:0;background:none;font-size:26px;color:#aaa;cursor:pointer}
.prog{flex:1;height:16px;background:var(--l);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--g);border-radius:9px;transition:width .4s}
#q{flex:1;overflow:auto;padding:8px 20px 20px;animation:slide .3s}
h2{font-size:22px;margin:8px 0 16px}
.rt{display:inline-block;background:#ffdfe0;color:#d33;border-radius:10px;padding:2px 10px;font-size:13px;font-weight:900;margin-bottom:6px}
.spk{width:84px;height:84px;border-radius:24px;border:0;background:var(--b);box-shadow:0 5px 0 var(--bd);font-size:38px;cursor:pointer;margin:6px 0 16px}
.spk:active,.mic:active{transform:translateY(4px);box-shadow:none}
.pic{display:block;width:100%;height:auto;max-height:min(38vh,300px);object-fit:contain;background:#f3f4f6;border-radius:20px;margin:0 auto 14px}
.em{font-size:96px;text-align:center;margin:8px 0 14px}
.opt,.tk,.mt{display:block;width:100%;padding:14px;margin:0 0 12px;border:2px solid var(--l);border-bottom-width:5px;border-radius:16px;background:#fff;font:800 18px Nunito,sans-serif;color:var(--t);cursor:pointer;text-align:left}
.opt.sel,.mt.sel{border-color:var(--b);background:#ddf4ff;color:var(--bd)}
.opt.ok,.mt.ok{border-color:var(--g);background:#d7ffb8;color:var(--gd)}
.opt.no{border-color:var(--r);background:#ffdfe0;color:#d33}
.zone{min-height:66px;border-bottom:2px solid var(--l);padding:6px 0;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.tk{width:auto;display:inline-block;margin:0;padding:10px 16px;text-align:center;animation:pop .2s}
@keyframes pop{from{transform:scale(.7)}}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tk.used{visibility:hidden}
.cols{display:grid;grid-template-columns:1fr 8px 1fr;gap:10px}.sep{width:8px;min-height:100%;border-radius:8px;box-shadow:0 0 0 2px #fff;background:linear-gradient(180deg,#ff4b4b,#ff9600,#ffc800,#58cc02,#1cb0f6,#a855f7)}.cols>div>.mt{margin-bottom:12px}
.mt{margin:0;text-align:center;font-size:16px;padding:16px 8px}
.mt.gone{visibility:hidden;transition:.3s}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.big{width:100%;padding:15px;border:0;border-radius:16px;background:var(--g);box-shadow:0 5px 0 var(--gd);color:#fff;font:900 17px Nunito,sans-serif;letter-spacing:.5px;cursor:pointer}
.big:disabled{background:var(--l);box-shadow:0 5px 0 #c8c8c8;color:#aaa}
.big:active:not(:disabled){transform:translateY(4px);box-shadow:none}
#ft{padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--l);transition:background .3s}
#ft.good{background:#d7ffb8}#ft.bad{background:#ffdfe0}#ft.bad .big{background:var(--r);box-shadow:0 5px 0 #ea2b2b}
#msg{font-weight:900;font-size:18px;margin-bottom:12px}#ft.good #msg{color:var(--gd)}#ft.bad #msg{color:#d33}
.mic{width:110px;height:110px;border-radius:50%;border:0;background:var(--b);box-shadow:0 6px 0 var(--bd);font-size:48px;display:block;margin:20px auto 8px;cursor:pointer}
.mic.rec{background:var(--r);animation:pulse .8s infinite}
.center{text-align:center}.said{color:#777;font-weight:700;margin-top:10px;min-height:24px}
.skip{margin-top:26px;border:0;background:none;color:#999;font:800 15px Nunito,sans-serif;text-decoration:underline;cursor:pointer}
#done{align-items:center;justify-content:center;text-align:center;padding:24px}
#done h1{font-size:34px;margin:10px 0}#lot{width:220px;height:220px}
.stat{display:inline-block;margin:6px;padding:12px 20px;border:2px solid var(--y);border-radius:16px;font-weight:900;font-size:20px;color:#d99c00}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:30;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#adm,#snd,#prz{border:2px solid var(--l);border-bottom-width:4px;border-radius:12px;background:#fff;font:800 13px Nunito,sans-serif;color:#777;padding:4px 10px;margin-right:8px;cursor:pointer}
#ab{padding:8px 20px;overflow:auto;flex:1}#ab label{display:block;font-weight:900;margin:16px 0 6px}
#ab select{width:100%;padding:12px;border:2px solid var(--l);border-radius:12px;font:700 16px Nunito,sans-serif;background:#fff}
#ab .chk{display:flex;gap:8px;align-items:center;font-weight:800}#ab .chk input{width:20px;height:20px}
#top{gap:8px}#top>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#top>span:last-child{white-space:nowrap;flex-shrink:0}
#snd{padding:3px 9px;font-size:16px}.bar #snd2{font-size:22px}
#quiz,#done,#admin,#prize{border-left:1px solid rgba(255,75,75,.55);border-right:1px solid rgba(255,75,75,.55)}
#prz{position:relative}#prz.dot::after{content:"";position:absolute;top:-5px;right:-3px;width:11px;height:11px;border-radius:50%;background:#ff4b4b;border:2px solid #fff}
#pinfo{padding:0 18px 10px;font-weight:800;color:#555;font-size:14px;border-bottom:2px solid var(--l)}
/* Kartların üst üste binmesini önleyen sarmalayıcı ve küçük 3 sütunlu dikey ızgara */
#pwrap{flex:1;overflow-y:auto;padding:14px 14px 36px;-webkit-overflow-scrolling:touch}
#pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}
.pc{position:relative;width:100%;aspect-ratio:2/3;border-radius:14px;overflow:hidden;border:3px solid #d9d9d9;background:linear-gradient(160deg,#6b7280,#374151);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.16)}
.pc .n{position:absolute;top:5px;left:7px;font-size:11px;background:rgba(0,0,0,.45);color:#fff;padding:1px 6px;border-radius:8px;z-index:2}
.pc .big2{font-size:32px}
.pc small{font-size:12px;opacity:.95;text-align:center;padding:0 4px}
.pc.ready{background:linear-gradient(160deg,#fbbf24,#f97316);border-color:#ffc800;animation:pulse 1.4s infinite;cursor:pointer}
.pc.own{background:#fff;border-color:#ffc800;cursor:zoom-in;padding:0}
.pc.own img,.pc.own .ph{width:100%;height:100%;object-fit:cover;display:block}
.ph{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;background:linear-gradient(160deg,#8b5cf6,#ec4899);color:#fff;font-weight:900;font-size:14px;text-align:center;padding:6px}
.pempty{grid-column:1/-1;text-align:center;padding:36px 16px;color:#777;font-weight:800;font-size:15px;background:#f9fafb;border:2px dashed #d1d5db;border-radius:16px}
#zoom{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.84);display:flex;align-items:center;justify-content:center;padding:16px;animation:slide .25s;cursor:pointer}
#zoom img,#zoom .ph{max-height:86vh;max-width:92vw;aspect-ratio:2/3;border-radius:18px;box-shadow:0 0 0 4px #ffc800,0 12px 40px rgba(0,0,0,.6);object-fit:cover}#zoom .ph{width:min(70vw,340px);font-size:24px}
@media(max-width:430px){#top{padding-left:10px;padding-right:10px}#top>span:first-child{font-size:0}#top>span:first-child::before{content:'🌍';font-size:20px}}
</style>
</head>
<body>
<div id="top"><span>🌍 English Adventure</span><span><button id="snd" aria-label="Ses efektleri">🔔</button><button id="prz">🎁 Ödüller</button><button id="adm">⚙️ Admin</button>⭐ <span id="xp">0</span> XP</span></div>
<main id="map"><p style="margin-top:60px;font-weight:800">Yükleniyor...</p></main>

<section id="quiz" hidden>
  <div class="bar"><button id="x" aria-label="Kapat">✕</button><div class="prog"><i id="pi"></i></div><button id="snd2" aria-label="Ses efektleri">🔔</button></div>
  <div id="q"></div>
  <footer id="ft"><div id="msg"></div><button class="big" id="btn">KONTROL ET</button></footer>
</section>

<section id="admin" hidden>
  <div class="bar"><button id="ax" aria-label="Kapat">✕</button><b style="font-size:20px">⚙️ Admin: ders / soru aç</b></div>
  <div id="ab">
    <label>Ünite</label><select id="au"></select>
    <label>Ders</label><select id="al"></select>
    <label>Soru</label><select id="aq"></select>
    <label class="chk" style="margin-top:20px"><input type="checkbox" id="ao"> Sadece bu soruyu aç</label>
    <p style="color:#777;font-weight:700;font-size:14px">Admin modunda ilerleme, XP ve yanlış listesi kaydedilmez. Kilitli dersler de açılır.</p>
  </div>
  <div style="padding:16px"><button class="big" id="ago">AÇ</button></div>
</section>

<section id="prize" hidden>
  <div class="bar"><button id="px" aria-label="Kapat">✕</button><b style="font-size:20px">🎁 Ödül Kartları</b><span id="pcnt" style="margin-left:auto;font-weight:900;color:#d99c00;font-size:18px"></span></div>
  <div id="pinfo"></div>
  <div id="pwrap"><div id="pgrid"></div></div>
</section>
<div id="zoom" hidden></div>

<section id="done" hidden>
  <div id="lot"></div><h1 id="dt"></h1>
  <div><span class="stat" id="ds"></span><span class="stat" id="dx"></span></div>
  <p id="dn" style="font-weight:800;color:#777"></p>
  <p style="width:100%;max-width:400px;margin-top:20px"><button class="big" id="dbtn">HARİTAYA DÖN</button></p>
</section>

<script>
const $=s=>document.querySelector(s);
const shuf=a=>[...a].sort(()=>Math.random()-.5);
const LESSON=5;               // bir dersteki hedef soru sayısı (100 soru = 20 ders)
const CARDS_PER_UNIT=4;       // her ünitede her 5 derste 1 sürpriz kart = 4 kart
const TOTAL_UNITS=6;          // toplam 6 tema/ünite
const TOTAL_CARDS=TOTAL_UNITS*CARDS_PER_UNIT; // 6 x 4 = 24 kart
const MAXUNIT=10;             // unit1.json ... unit10.json aranır
const ADMIN_PIN='';           // boş değilse Admin açılırken bu şifre sorulur
let UN=[],QM={},Q={},warns=[];
let P=JSON.parse(localStorage.getItem('lr2')||'{"done":{},"wrong":{},"xp":0}');
P.best=P.best||{};P.ub=P.ub||{};P.cards=P.cards||{};
const UNIT_BONUS=100;         // bir üniteyi bitirince (ilk kez) verilen bonus XP

/* Kart i (1..24) hangi ünite ve ders sonunda açılır: her 5. ders (Ders 5, 10, 15, 20) */
const cardUnit=i=>Math.ceil(i/CARDS_PER_UNIT);
const cardLessonIdx=i=>(((i-1)%CARDS_PER_UNIT)+1)*5-1; // 4, 9, 14, 19 (0-indeksli)
const cardLessonKey=i=>`u${cardUnit(i)}-L${cardLessonIdx(i)}`;
const isCardReady=i=>!!P.done[cardLessonKey(i)]&&!P.cards[i];
const anyCardReady=()=>Array.from({length:TOTAL_CARDS},(_,k)=>k+1).some(isCardReady);

const save=()=>{localStorage.setItem('lr2',JSON.stringify(P));$('#xp').textContent=P.xp;const b=$('#prz');b&&b.classList.toggle('dot',anyCardReady())};

/* ---------- Ses efektleri: sounds/*.mp3 varsa onlar, yoksa yerleşik sesler ---------- */
let SND=localStorage.getItem('lr_snd')!=='0';   // doğru/yanlış/alkış efektleri
function sfx(n){if(!SND)return;const a=new Audio('sounds/'+n+'.mp3');a.play().catch(()=>beep(n))}
function beep(n){try{const c=new(window.AudioContext||webkitAudioContext)(),t=c.currentTime;
 if(n=='applause'||n=='applauseunit'){const b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.max(0,1-i/d.length)*(Math.random()>.7?1:.15);const s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start();return}
 (n=='correct'?[660,880]:[200,150]).forEach((h,i)=>{const o=c.createOscillator(),g=c.createGain();o.type=n=='correct'?'sine':'sawtooth';o.frequency.value=h;g.gain.setValueAtTime(.2,t+i*.15);g.gain.exponentialRampToValueAtTime(.001,t+i*.15+.3);o.connect(g);g.connect(c.destination);o.start(t+i*.15);o.stop(t+i*.15+.3)})}catch(e){}}

/* ---------- Sesli okuma: tarayıcının kendi konuşma sentezi (Android'de Google sesleri) ---------- */
let VOICES=[];const loadVoices=()=>{VOICES=window.speechSynthesis?speechSynthesis.getVoices():[]};
if(window.speechSynthesis){loadVoices();speechSynthesis.addEventListener&&speechSynthesis.addEventListener('voiceschanged',loadVoices)}
const vl=v=>v.lang.toLowerCase().replace('_','-');
function pickVoice(lang){const L=lang.toLowerCase(),vs=VOICES.filter(v=>vl(v).startsWith(L.slice(0,2)));   // yalnızca aynı dilin sesleri
 return vs.find(v=>vl(v)===L&&/google/i.test(v.name))||vs.find(v=>vl(v)===L)||vs.find(v=>/google/i.test(v.name))||vs[0]||null}
function stopSpeech(){window.speechSynthesis&&speechSynthesis.cancel()}
let sayTok=0;
function say(text,lang){text=(text||'').trim();if(!text||!window.speechSynthesis)return;stopSpeech();const my=++sayTok;
 const l=/^tr/i.test(lang||'')?'tr-TR':(/^en-us/i.test(lang||'')?'en-US':'en-GB');let retried=false;
 const go=again=>{if(my!==sayTok)return;
  const u=new SpeechSynthesisUtterance(text);u.lang=l;u.rate=.85;
  if(!VOICES.length)loadVoices();const v=pickVoice(l);if(v){u.voice=v;u.lang=v.lang}
  let started=false;u.onstart=()=>{started=true};
  const retry=()=>{if(again||retried||my!==sayTok)return;retried=true;try{speechSynthesis.cancel()}catch(e){}setTimeout(()=>go(true),150)};
  u.onerror=e=>{if(!started&&!/cancel|interrupt/i.test((e&&e.error)||''))retry()};
  try{speechSynthesis.resume()}catch(e){}speechSynthesis.speak(u);
  if(!again)setTimeout(()=>{if(!started&&!speechSynthesis.speaking)retry()},1000)};
 setTimeout(()=>go(false),60)}
addEventListener('pointerdown',()=>{try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}},{once:true});
/* Dil tahmini: Türkçe belirtisi (harf / sık kelime) varsa Türkçe, yoksa İngilizce */

  try{const r=await fetch(`unit${n}.json`);if(!r.ok)return null;
   try{return {n,j:await r.json()}}catch(e){warns.push(`unit${n}.json okunamadı (JSON söz dizimi hatası)`);return null}}
  catch(e){return null}}));
 const valid=res.filter(Boolean);
 if(!valid.length&&typeof FALLBACK_U1==='object')valid.push({n:1,j:FALLBACK_U1});
 valid.sort((a,b)=>(a.j.unit||a.n)-(b.j.unit||b.n)).forEach(({n,j})=>buildUnit(j.unit||n,j));
}
const EMJ=['⭐','🎯','🧩','🎧','🎤','📖'];
/* Aynı tür sorular üst üste gelmesin: sabit (rastgele olmayan) bir sırayla bölümler arasında dönüşümlü seç */
const kindOf=x=>x.type=='choice'?(x.image?'img':x.audio?'listen':'tr'):x.type;
function mixQ(secs){const q=secs.map(a=>a.slice()),out=[],total=q.reduce((n,a)=>n+a.length,0);let last=null,last2=null;
 while(out.length<total){const rem=total-out.length,cnt={};
  q.forEach(a=>a.forEach(x=>{const k=kindOf(x);cnt[k]=(cnt[k]||0)+1}));
  let best=-1,bs=-1e9;
  q.forEach((a,i)=>{if(!a.length)return;const x=a[0],k=kindOf(x);let sc=cnt[k]*2-i*3;
   if(last&&k===last.k)sc-=10000;
   if(2*cnt[k]-1>=rem)sc+=5000;
   if(last&&x.type===last.type)sc-=300;
   if(last2&&k===last2.k)sc-=40;if(last2&&x.type===last2.type)sc-=10;
   if(sc>bs){bs=sc;best=i}});
  const x=q[best].shift();out.push(x);last2=last;last={type:x.type,k:kindOf(x)}}
 return out}
function buildUnit(n,j){

 const secs=(j.sections||[]).map((s,si)=>{const qs=(s.questions||[]).filter(q=>['choice','arrange','match','speak'].includes(q.type));
  qs.forEach((q,i)=>{q._id=`u${n}:${q.id||(s.id||si)+'-'+i}`;QM[q._id]=q;u.ids.push(q._id)});return qs});
 const seq=mixQ(secs),k=Math.max(1,Math.round(seq.length/LESSON)),base=Math.floor(seq.length/k),extra=seq.length%k;
 let p=0;for(let i=0;i<k&&seq.length;i++){const sz=base+(i<extra?1:0);
  u.lessons.push({key:`u${n}-L${i}`,title:`Ders ${i+1}`,emoji:EMJ[i%EMJ.length],qs:seq.slice(p,p+sz)});p+=sz}

$('#au').onchange=fillL;$('#al').onchange=fillQ;$('#ax').onclick=()=>$('#admin').hidden=true;
$('#ago').onclick=()=>{const u=UN[$('#au').value],l=u.lessons[$('#al').value],i0=+$('#aq').value,only=$('#ao').checked;
 const qs=(only?[l.qs[i0]]:l.qs).map(q=>({...q}));Q={admin:1,unit:u,qs,i:only?0:i0,ok:0,n:qs.length,cur:null};$('#admin').hidden=true;open()};

/* ---------- Ödül kartları (Her ünitede 4 kart, 6 ünitede 24 kart; Ödüllerde o zamana kadar açılanlar görünür) ---------- */
const cNN=i=>String(i).padStart(2,'0');
window.cardErr=img=>{const n=img.dataset.n,t=+(img.dataset.t||0)+1,c=[`cards/card${n}.png`,`images/card${n}.png`,`card${n}.png`];
 if(t<c.length){img.dataset.t=t;img.src=c[t]}else img.outerHTML=`<div class="ph"><span style="font-size:32px">🎴</span>Kart ${n}</div>`};
const cardImg=i=>`<img data-n="${cNN(i)}" src="cards/card${cNN(i)}.png" alt="Kart ${cNN(i)}" onerror="cardErr(this)">`;

function openOrZoomCard(i){
 if(!P.cards[i]){
  if(!P.done[cardLessonKey(i)])return;
  P.cards[i]=1;save();sfx('applause');confetti();renderMap();
 }
 zoomCard(i);
}

function renderPrize(){
 const allIds=Array.from({length:TOTAL_CARDS},(_,k)=>k+1);
 const openedIds=allIds.filter(i=>P.cards[i]);
 const readyIds=allIds.filter(isCardReady);
 const visibleIds=allIds.filter(i=>P.cards[i]||isCardReady(i));
 $('#pcnt').textContent=`${openedIds.length}/${TOTAL_CARDS}`;
 $('#pinfo').innerHTML=`🃏 Açılan Kart: <b>${openedIds.length} / ${TOTAL_CARDS}</b>`+(readyIds.length?` · 🎁 <b>${readyIds.length} yeni kart</b> açılmayı bekliyor!`:' · Her 5 derste 1 sürpriz kart açılır (Ünite başına 4 kart).');
 if(!visibleIds.length){
  $('#pgrid').innerHTML=`<div class="pempty">🎁 Henüz açılan sürpriz kartın yok.<br><br>Haritada her <b>5 dersi</b> tamamladığında çıkan dikdörtgen <b>Sürpriz Kart</b> kutusuna dokunarak kartlarını açabilirsin!<br><small>(Her ünitede 4 kart · 6 ünitede toplam 24 kart)</small></div>`;
  return;
 }
 $('#pgrid').innerHTML=visibleIds.map(i=>{
  const n=cNN(i),uNum=cardUnit(i),lNum=cardLessonIdx(i)+1;
  if(P.cards[i])return `<div class="pc own" data-i="${i}" title="Kart ${n} (Ünite ${uNum} · Ders ${lNum})"><span class="n">#${n}</span>${cardImg(i)}</div>`;
  return `<div class="pc ready" data-i="${i}"><span class="n">#${n}</span><span class="big2">🎁</span>AÇ!<small>Ünite ${uNum} · Ders ${lNum}</small></div>`;
 }).join('');
 $('#pgrid').querySelectorAll('.pc.own').forEach(e=>e.onclick=()=>zoomCard(+e.dataset.i));
 $('#pgrid').querySelectorAll('.pc.ready').forEach(e=>e.onclick=()=>{const i=+e.dataset.i;P.cards[i]=1;save();sfx('applause');confetti();renderPrize();renderMap();zoomCard(i)})
}
function zoomCard(i){$('#zoom').innerHTML=cardImg(i);$('#zoom').hidden=false}
$('#zoom').onclick=()=>{$('#zoom').hidden=true};
$('#prz').onclick=()=>{renderPrize();$('#prize').hidden=false};
$('#px').onclick=()=>{$('#prize').hidden=true};

loadUnits().then(renderMap).catch(e=>{$('#map').innerHTML='<p style="margin:60px 20px">Yükleme hatası. Siteyi Netlify veya yerel sunucuda aç.</p>'});
window.speechSynthesis&&speechSynthesis.getVoices();
</script>
</body>
</html>
